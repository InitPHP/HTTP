name: Tests

on:
  push:
    branches: [main, 2.x, 3.x]
  pull_request:
    branches: [main, 2.x, 3.x]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / ${{ matrix.dependency-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        dependency-version: [prefer-stable]
        include:
          - php: '8.2'
            dependency-version: prefer-lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl, mbstring
          coverage: none
          tools: composer:v2

      # Composer's solver picks the newest PHPUnit and http-factory-tests lines
      # each PHP version supports, based on the ranges in composer.json.
      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox
